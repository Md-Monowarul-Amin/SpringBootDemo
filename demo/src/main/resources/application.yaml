spring:
  application:
    name: demo

  data:
    redis:
      host: localhost
      port: 6379
      password: password  # matches your Docker container's REDIS_ARGS
      timeout: 3s         # optional, connection timeout

# Optional: Actuator health for Redis
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: true
  data:
    redis:
      password: password  # Remove if no password
      timeout: 3s
      client-type: lettuce
      cluster:
        nodes:
          - localhost:7000
          - localhost:7001
          - localhost:7002